name: Verify local demonstrator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/validate-artifacts.py
      - run: npx playwright install --with-deps chromium
      - run: npm start > /tmp/fieldops-server.log 2>&1 &
      - run: node -e "for(let i=0;i<30;i++){try{const r=await fetch('http://127.0.0.1:3600/api/health');if(r.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)"
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/evidence/*.png
            test-results/
